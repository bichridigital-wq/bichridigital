name: Live push check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the protected live-check route
        env:
          CRON_SECRET: ${{ secrets.BICHRIDIGITAL_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "BICHRIDIGITAL_CRON_SECRET is not configured."
            exit 1
          fi
          curl --fail --silent --show-error \
            --max-time 30 \
            --request GET \
            --output /dev/null \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://www.bichridigital.com/api/internal/push/live-check
